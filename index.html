function meso(){const c=[['سومر','٤٥٠٠–١٩٠٠ ق.م','مهد أول المدن: أوروك وأور ولكش. اخترع السومريون الكتابة المسمارية والعجلة والزقورات.'],['أكد','٢٣٣٤–٢١٥٤ ق.م','أسّسها سرجون الأكدي، وهي أول إمبراطورية في التاريخ، وكانت الأكدية لغة الدبلوماسية.'],['بابل','١٨٩٤–٥٣٩ ق.م','عاصمة حمورابي ونبوخذنصر، اشتهرت بالقانون وبوابة عشتار والجنائن المعلقة.'],['آشور','٢٥٠٠–٦١٢ ق.م','إمبراطورية قوية عاصمتها آشور ونمرود ونينوى، وفيها مكتبة آشوربانيبال.']],tl=[['~٣٣٠٠ ق.م','ظهور الكتابة المسمارية في أوروك'],['~٢١١٢ ق.م','بناء زقورة أور'],['~١٧٥٤ ق.م','شريعة حمورابي'],['~٧٠٠ ق.م','نينوى عاصمة الإمبراطورية الآشورية'],['٥٣٩ ق.م','سقوط بابل بيد قورش']];
return`<h2 class="t">${t('meso')}</h2><p style="color:var(--mu)">«ما بين النهرين» دجلة والفرات، أرض الحضارات الأولى في العراق.</p><div class="info">${c.map(x=>`<div class="ic"><h3>${x[0]}</h3><small>${x[1]}</small><p>${x[2]}</p></div>`).join('')}</div><h2 class="t">الخط الزمني</h2><div class="tll">${tl.map(x=>`<p><b>${x[0]}</b> — ${x[1]}</p>`).join('')}</div>`}
function tog(id){fav=fav.includes(id)?fav.filter(x=>x!=id):fav.concat(id);save();render();if($('#md').classList.contains('open'))openM(id,curEp)}
let curEp=0;
function openM(id,i=0){const m=byId(id);if(!m)return;cur=m;curEp=i;if(i==0&&!$('#md').classList.contains('open')){m.views=(m.views||0)+1}hist=[id].concat(hist.filter(x=>x!=id)).slice(0,40);save();
const e=m.eps[i]||{},sub=e.subText?URL.createObjectURL(new Blob([e.subText],{type:'text/vtt'})):'',f=fav.includes(id);
$('#bx').className='box';$('#bx').innerHTML=`<button class="x" onclick="closeM()">×</button><h2 class="t" style="margin-top:0">${esc(m.title)} ${star(m)}</h2>${e.url?`<video controls autoplay src="${esc(e.url)}">${sub?`<track kind="subtitles" srclang="ar" label="العربية" default src="${sub}">`:''}</video>`:`<div class="novid">${t('nov')}</div>`}${m.eps.length>1?`<div class="eps">${m.eps.map((x,j)=>`<button class="btn ${j==i?'':'alt'}" onclick="openM(${id},${j})">${esc(x.t)}</button>`).join('')}</div>`:''}<p style="color:var(--mu)">${esc(m.genre)} · ${esc(m.year)}</p><p>${esc(m.desc)}</p><button class="btn alt" onclick="tog(${id})">${f?'✓ '+t('rem'):'+ '+t('add')}</button>`;$('#md').classList.add('open')}
function closeM(){$('#md').classList.remove('open');$('#bx').innerHTML=''}
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
function loginUI(){if(admin){admin=false;if(view=='admin')view='home';chrome();render();return}
$('#bx').className='box sm';$('#bx').innerHTML=`<button class="x" onclick="closeM()">×</button><h2 class="t" style="margin-top:0">${t('login')}</h2><label>${t('user')}</label><input class="f" id="lu" autocomplete="username"><br><label>${t('pw')}</label><input class="f" type="password" id="lp" autocomplete="current-password"><p id="le" style="color:#ff6b6b;margin:8px 0"></p><button class="btn" id="lb">${t('login')}</button>`;$('#md').classList.add('open');
$('#lb').onclick=async()=>{const p=$('#lp').value;let ok=false;if(API){try{ok=(await fetch(API+'/auth',{headers:{'x-pw':p}})).ok}catch(e){}}else ok=(await sha(p))==PH;if(ok){pw=p;admin=true;closeM();view='admin';chrome();render()}else $('#le').textContent=t('bad')}}
function adminUI(){return`<h2 class="t">إضافة محتوى جديد</h2><div class="box" style="max-width:none"><div class="fr"><div><label>النوع</label><select class="f" id="a_type" onchange="eps()"><option value="movie">فيلم</option><option value="series">مسلسل</option></select></div><div><label>العنوان</label><input class="f" id="a_title"></div><div><label>السنة</label><input class="f" id="a_year" type="number" value="2026"></div><div><label>التقييم (مثال 8.4)</label><input class="f" id="a_rate"></div><div class="full"><label>التصنيف</label><input class="f" id="a_genre" placeholder="دراما، وثائقي…"></div><div class="full"><label>القصة</label><textarea class="f" id="a_desc" rows="3"></textarea></div><div><label>صورة الغلاف (عمودية)</label><input class="f" type="file" accept="image/*" onchange="pic(this,'poster',300,450)"></div><div><label>صورة الخلفية (أفقية)</label><input class="f" type="file" accept="image/*" onchange="pic(this,'bd',1280,600)"></div></div><h3>الفيديو / الحلقات</h3><div id="eps"></div><button class="btn alt" onclick="addEp()">+ حلقة</button><p style="font-size:12px;color:var(--mu)">الترجمة بصيغة SRT أو VTT. الفيديو: رابط مباشر أو ملف من جهازك (يعمل في هذه الجلسة فقط).</p><button class="btn" onclick="addItem()">💾 حفظ ونشر</button></div><h2 class="t">الإعلان (300×250)</h2><div class="box" style="max-width:none"><div class="fr"><div><label>صورة الإعلان</label><input class="f" type="file" accept="image/*" onchange="adPic(this)"></div><div><label>رابط المعلن</label><input class="f" dir="ltr" id="lk1" value="${esc(ad.link||'')}" placeholder="https://…"></div></div><br><button class="btn" onclick="adSave()">حفظ الإعلان</button> <button class="btn alt" onclick="adClear()">إزالة</button></div><h2 class="t">البانر السفلي (728×90)</h2><div class="box" style="max-width:none"><div class="fr"><div><label>صورة البانر</label><input class="f" type="file" accept="image/*" onchange="barPic(this)"></div><div><label>رابط المعلن</label><input class="f" dir="ltr" id="bar_link" value="${esc(ad2.link||'')}" placeholder="https://…"></div></div><br><button class="btn" onclick="barSave()">حفظ البانر</button> <button class="btn alt" onclick="barClear()">إزالة</button></div><h2 class="t">النشر للزوار</h2><div class="box" style="max-width:none"><p>ما تضيفه يُحفظ في متصفحك فقط. ليظهر للجميع: اضغط تصدير، ثم ارفع الملف <b>content.json</b> إلى مستودع GitHub (Add file → Upload files) بجانب index.html.</p><button class="btn" onclick="exportC()">⬇ تصدير content.json</button> <button class="btn alt" onclick="pub(1)">☁ نشر الآن</button></div><h2 class="t">المحتوى الحالي (${db.length})</h2><table>${db.map(m=>`<tr><td><img src="${m.poster}"></td><td>${esc(m.title)}</td><td>${m.type=='movie'?'فيلم':'مسلسل'}</td><td><button class="btn alt" onclick="del(${m.id})">حذف</button></td></tr>`).join('')}</table>`}
function eps(){const s=$('#eps');if(!s)return;const mv=$('#a_type').value=='movie';if(mv&&draft.eps.length>1)draft.eps.length=1;
s.innerHTML=draft.eps.map((e,i)=>`<div class="ep"><div class="fr"><div><label>العنوان</label><input class="f" value="${esc(e.t)}" oninput="draft.eps[${i}].t=this.value" placeholder="${mv?'الفيلم':'الحلقة '+(i+1)}"></div><div><label>رابط الفيديو</label><input class="f" dir="ltr" value="${esc(e.url.startsWith('blob:')?'':e.url)}" oninput="draft.eps[${i}].url=this.value" placeholder="https://…"></div><div><label>أو ملف فيديو</label><input class="f" type="file" accept="video/*" onchange="draft.eps[${i}].url=URL.createObjectURL(this.files[0])"></div><div><label>ملف الترجمة</label><input class="f" type="file" accept=".srt,.vtt" onchange="sub(this,${i})"></div></div></div>`).join('')}
function addEp(){if($('#a_type').value=='movie')return alert('الفيلم له ملف واحد');draft.eps.push({t:'',url:'',sub:''});eps()}
function sub(inp,i){const f=inp.files[0];if(!f)return;f.text().then(x=>{x=x.replace(/^\uFEFF/,'').replace(/\r/g,'');if(!/^WEBVTT/.test(x.trim()))x='WEBVTT\n\n'+x.replace(/(\d+):(\d+):(\d+),(\d+)/g,'$1:$2:$3.$4');draft.eps[i].subText=x})}
function pic(inp,k,w,h){const f=inp.files[0];if(!f)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),r=Math.max(w/im.width,h/im.height);x.drawImage(im,(w-im.width*r)/2,(h-im.height*r)/2,im.width*r,im.height*r);draft[k]=c.toDataURL('image/jpeg',.72)};im.src=URL.createObjectURL(f)}
function addItem(){const ti=$('#a_title').value.trim();if(!ti)return alert('أدخل العنوان');const ty=$('#a_type').value;
const ph='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450"><rect width="300" height="450" fill="#0c1d29"/><path d="M60 330h30v-30h30v-30h60v30h30v30h30v30H60z" fill="#e2b44f" opacity=".5"/></svg>`);
db.push({id:Date.now(),local:true,type:ty,title:ti,year:$('#a_year').value,rating:$('#a_rate').value,genre:$('#a_genre').value||'—',desc:$('#a_desc').value,poster:draft.poster||ph,backdrop:draft.bd||draft.poster||'',views:0,eps:draft.eps.map((e,i)=>({t:e.t||(ty=='series'?t('ep')+' '+(i+1):t('movie')),url:e.url,subText:e.subText||''}))});
save();draft={eps:[{t:'',url:'',sub:''}],poster:'',bd:''};alert('تمت الإضافة ✔');render();pub()}
let adTmp='';
function adPic(inp){const f=inp.files[0];if(!f)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=300;c.height=250;const x=c.getContext('2d'),r=Math.max(300/im.width,250/im.height);x.drawImage(im,(300-im.width*r)/2,(250-im.height*r)/2,im.width*r,im.height*r);adTmp=c.toDataURL('image/jpeg',.8)};im.src=URL.createObjectURL(f)}
function adSave(){ad={img:adTmp||ad.img||'',link:$('#lk1').value.trim()};save();renderAd();alert('تم حفظ الإعلان ✔');pub()}
function adClear(){ad={};adTmp='';save();renderAd();pub()}
function renderAd(){const w=$('#pw1'),b=$('#pbx1'),k=ad.img?ad.img.length+(ad.link||''):'';if(ad.img&&b.dataset.k==k){w.style.display='';return}if(b.dataset.m){b.innerHTML='';delete b.dataset.m;delete b.dataset.k}
if(ad.img){b.dataset.k=k;b.innerHTML=`<a href="${esc(ad.link||'#')}" target="_blank" rel="sponsored noopener"><img src="${ad.img}" width="300" height="250" alt=""></a>`;b.dataset.m=1}
else if(!b.children.length&&admin){b.innerHTML='<div class="pph">مساحة إعلانية 300×250</div>';b.dataset.m=1}
w.style.display=b.children.length?'':'none'}
let barTmp='';
function barPic(inp){const f=inp.files[0];if(!f)return;const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=728;c.height=90;const x=c.getContext('2d'),r=Math.max(728/im.width,90/im.height);x.drawImage(im,(728-im.width*r)/2,(90-im.height*r)/2,im.width*r,im.height*r);barTmp=c.toDataURL('image/jpeg',.8)};im.src=URL.createObjectURL(f)}
function barSave(){ad2={img:barTmp||ad2.img||'',link:$('#bar_link').value.trim()};save();renderBar();alert('تم حفظ البانر ✔');pub()}
function barClear(){ad2={};barTmp='';save();renderBar();pub()}
function renderBar(){const w=$('#pbar'),b=$('#pbarbox'),k=ad2.img?ad2.img.length+(ad2.link||''):'';if(ad2.img&&b.dataset.k==k){w.style.display='flex';document.body.classList.add('hasbar');return}if(b.dataset.m){b.innerHTML='';delete b.dataset.m;delete b.dataset.k}
if(ad2.img){b.dataset.k=k;b.innerHTML=`<a href="${esc(ad2.link||'#')}" target="_blank" rel="sponsored noopener"><img src="${ad2.img}" alt=""></a>`;b.dataset.m=1}
else if(!b.children.length&&admin){b.innerHTML='<div class="pph">مساحة إعلانية 728×90</div>';b.dataset.m=1}
const on=b.children.length>0;w.style.display=on?'flex':'none';document.body.classList.toggle('hasbar',on)}
function del(id){if(confirm('حذف هذا العنوان؟')){db=db.filter(m=>m.id!=id);fav=fav.filter(x=>x!=id);hist=hist.filter(x=>x!=id);save();render();pub()}}
chrome();render();
function payload(){return{db:db.map(m=>{const c={...m};delete c.local;c.eps=c.eps.map(e=>({...e,url:(e.url||'').startsWith('blob:')?'':e.url}));return c}),ad,ad2}}
async function pub(v){if(!API){if(v)alert('API غير مضبوط');return}try{const r=await fetch(API+'/content',{method:'PUT',headers:{'x-pw':pw,'content-type':'application/json'},body:JSON.stringify(payload())});if(!r.ok)throw 0;db.forEach(m=>delete m.local);save();if(v)alert('تم النشر ✔')}catch(e){alert('تعذر النشر — تحقق من الاتصال وكلمة المرور')}}
function exportC(){const o={db:db.map(m=>{const c={...m};delete c.local;c.eps=c.eps.map(e=>({...e,url:(e.url||'').startsWith('blob:')?'':e.url}));return c}),ad,ad2};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='content.json';a.click()}
fetch(API?API+'/content':'content.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!j)return;if(API){const ids=(j.db||[]).map(m=>m.id);db=(j.db||[]).concat(db.filter(m=>m.local&&!ids.includes(m.id)));ad=j.ad||{};ad2=j.ad2||{};render();return}const loc=db.filter(m=>m.local),ids=(j.db||[]).map(m=>m.id);db=(j.db||[]).concat(loc.filter(m=>!ids.includes(m.id)));if(!ad.img&&j.ad&&j.ad.img)ad=j.ad;if(!ad2.img&&j.ad2&&j.ad2.img)ad2=j.ad2;render();renderAd()}).catch(()=>{});

{let d=null;try{d=localStorage.getItem('sinan_dev')}catch(e){}if(d){applyDev(d)}else{applyDev(innerWidth<700?'phone':innerWidth<1000?'tab':'pc');devAsk()}}
